let auto=true,pause=false;
function start(){const res=critic();window.__crit=res;document.getElementById('mt').innerHTML=res.R.map(r=>`<div class="m"><span>${r[0]}</span><b class="${r[4]>=9?'ok':'bad'}">${r[1].toFixed(2)} ${r[2]} · ${r[4]}</b></div>`).join('');

 const hit=k=>{if(st.atk<0){st.atk=0;st.ak=k;st.hd=0;st.bo=0}},dash=()=>{if(st.dsh<0)st.dsh=0};document.getElementById('ba').onclick=()=>hit(0);document.getElementById('bb').onclick=()=>hit(1);document.getElementById('bc').onclick=()=>hit(2);document.getElementById('bd').onclick=dash;

 function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!pause){t0+=dt;let k;

  if(auto)vs.value=k*100;vv.textContent=(k*100|0)+'%';const f=frame(k*VB,dt);gm.textContent=f.D>.05?'рывок':f.AT>=0?'удар '+(f.ak+1):f.g>.5?'бег':f.m>.3?'шаг':'стойка';draw(f)}requestAnimationFrame(loop)}requestAnimationFrame(loop)}
