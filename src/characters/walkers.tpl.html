let AC=null;function thump(p,boss){if(!document.getElementById('snd').checked)return;AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(boss?70:150,t);o.frequency.exponentialRampToValueAtTime(boss?32:70,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(cl(.15+p*.5,.05,.7),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(boss?.5:.18));o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.6)}
function step(dt){for(const [i,c] of chars.entries()){let inp;
  if(i==selI){inp={dir:(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dz:(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),run:keys.ShiftLeft||keys.ShiftRight};if(inp.dir||inp.dz)c.manual=1;if(!c.manual)inp=null}
  if(!inp){const a=c.ai;a.t-=dt;if(a.t<0){if(a.dir){a.dir=0;a.dz=0;a.t=.8+Math.random()*1.4}else{a.dir=c.x>c.home+260?-1:c.x<c.home-260?1:(Math.random()<.5?-1:1);a.dz=(Math.random()-.5)*.8;a.t=2.5+Math.random()*2.5}}inp={dir:a.dir,dz:a.dz,run:false}}
  Walker.update(c,dt,inp);
  for(const e of c.events){const g=c.g,p=e.power;if(g.shake>0){shake=Math.max(shake,g.shake*(c.def.boss?16:6));}
   const n=Math.round(3+g.dust*14);for(let k=0;k<n;k++)dust.push({x:e.x+(Math.random()-.5)*40*g.dust,z:e.z,y:0,vx:(Math.random()-.5)*(60+200*g.dust),vy:-(20+Math.random()*80*g.dust),r:(4+Math.random()*10)*(.6+g.dust),t:0,life:.5+.6*g.dust});
   if(g.cracks){cracks.push({x:e.x*1,z:e.z,t:0,seed:Math.random()*1000,s:(c.def.boss?1:.5)*WS*1.4});rings.push({x:e.x,z:e.z,t:0,s:WS})}
   if(p>.1)thump(p,c.def.boss)}}
 const c=chars[selI];camX=lp(camX,c.x,1-Math.exp(-dt*3));shake*=Math.exp(-dt*7);
 dust=dust.filter(d=>(d.t+=dt)<d.life);for(const d of dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=60*dt;d.vx*=.97}
 cracks=cracks.filter(k=>(k.t+=dt)<6);rings=rings.filter(r=>(r.t+=dt)<.6)}
function background(ox){const g=ctx.createLinearGradient(0,0,0,FLOOR0);g.addColorStop(0,'#0b0f1c');g.addColorStop(1,'#1c2236');ctx.fillStyle=g;ctx.fillRect(0,0,W,FLOOR0+4);
 ctx.fillStyle='rgba(220,230,255,.85)';ctx.beginPath();ctx.arc(820-ox*.05,90,34,0,TAU);ctx.fill();
 ctx.fillStyle='#141a2a';for(let i=-2;i<12;i++){const x=((i*260-ox*.2)%3120+3120)%3120-300;ctx.beginPath();ctx.moveTo(x,FLOOR0);ctx.lineTo(x+120,FLOOR0-160-(i%3)*40);ctx.lineTo(x+260,FLOOR0);ctx.fill()}
 for(let i=-2;i<16;i++){const x=((i*180-ox*.5)%3240+3240)%3240-200;ctx.fillStyle='#1d2335';ctx.fillRect(x,FLOOR0-230,46,230);ctx.fillStyle='#262d42';ctx.fillRect(x-8,FLOOR0-240,62,16);if(i%3==0){ctx.fillStyle='#1d2335';ctx.beginPath();ctx.arc(x+113,FLOOR0-230,67,Math.PI,0);ctx.lineTo(x+180,FLOOR0-230);ctx.fill()}}
 const fg=ctx.createLinearGradient(0,FLOOR0,0,FLOOR1);fg.addColorStop(0,'#232838');fg.addColorStop(1,'#353b4d');ctx.fillStyle=fg;ctx.fillRect(0,FLOOR0,W,H-FLOOR0);
 ctx.strokeStyle='rgba(10,12,18,.55)';ctx.lineWidth=2;for(let r=0;r<6;r++){const y=lp(FLOOR0,FLOOR1+30,(r/6)**1.1);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();const w=lp(110,170,r/6),o=((-ox+r*55)%w+w)%w;for(let x=o;x<W;x+=w){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,lp(FLOOR0,FLOOR1+30,((r+1)/6)**1.1));ctx.stroke()}}}
function wx(x){return W/2+(x-camX)*WS}
function render(){const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.translate(sx,sy);background(camX*WS);
 // трещины и волна на полу
 for(const k of cracks){const x=wx(k.x),y=zy(k.z),a=k.t<5?1:1-(k.t-5),R=k.s;ctx.save();ctx.translate(x,y);ctx.scale(1,.35);ctx.globalAlpha=a;ctx.strokeStyle='#0b0d12';ctx.lineWidth=3;let s=k.seed;const rn=()=>{s=(s*9301+49297)%233280;return s/233280};for(let i=0;i<7;i++){let a0=rn()*TAU,px=0,py=0;ctx.beginPath();ctx.moveTo(0,0);for(let j=0;j<4;j++){a0+=(rn()-.5)*.8;px+=Math.cos(a0)*28*R;py+=Math.sin(a0)*28*R;ctx.lineTo(px,py)}ctx.stroke()}ctx.strokeStyle='rgba(124,199,255,.35)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
 for(const r of rings){const x=wx(r.x),y=zy(r.z),k=r.t/.6;ctx.strokeStyle=`rgba(200,210,230,${.4*(1-k)})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,(40+260*k)*r.s,(40+260*k)*.28*r.s,0,0,TAU);ctx.stroke()}
 const order=[...chars].sort((a,b)=>a.z-b.z),showJ=document.getElementById('jt').checked;
 for(const c of order){const s=zs(c.z),x=wx(c.x),y=zy(c.z);if(x<-400||x>W+400)continue;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,(c.def.boss?120:48)*s,(c.def.boss?22:10)*s,0,0,TAU);ctx.fill();
  const J=joints(c);ctx.save();ctx.translate(x,y-c.pose.hip*s);ctx.scale(c.face*s,s);ctx.rotate(c.pose.roll*.3);
  DRAW[c.def.id](c,J,true);DRAW[c.def.id](c,J,false);
  if(showJ){ctx.fillStyle='#ffd84a';for(const l of J.legs)for(const p of [[0,0],[l.kx,l.ky],[l.ax,l.ay]]){ctx.beginPath();ctx.arc(p[0],p[1],4/s,0,TAU);ctx.fill()}}
  ctx.restore()}
 for(const d of dust){const x=wx(d.x),y=zy(d.z)+d.y,k=d.t/d.life;ctx.fillStyle=`rgba(150,145,140,${.4*(1-k)})`;ctx.beginPath();ctx.arc(x,y,d.r*(1+k*1.5),0,TAU);ctx.fill()}
 const c=chars[selI];document.getElementById('m').textContent=`${c.def.name}: скорость ${(Math.abs(c.v)/(c.def.L1+c.def.L2)).toFixed(2)} L/с · таз ${c.pose.hip.toFixed(0)} · глубина ${c.z.toFixed(2)}${c.manual?' · управление':' · бродит сам'}`}
let last=null;function loop(ts){const dt=last==null?1/60:Math.min(.05,(ts-last)/1000);last=ts;if(!paused)step(dt);render();requestAnimationFrame(loop)}
for(let i=0;i<10;i++)step(1/60);requestAnimationFrame(loop);
window.__dbg={chars,step,render,setSel:i=>selI=i};
</script></body></html>
