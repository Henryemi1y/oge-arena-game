<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Походки врагов и боссов</title>
<style>
:root{--bg:#0e1118;--panel:#161b26;--tx:#dfe5f0;--mut:#8c97ab;--ac:#5b8cff;--line:#2a3142}
:root[data-theme="light"]{--bg:#eef1f6;--panel:#fff;--tx:#18202e;--mut:#5c677a;--ac:#2f62e0;--line:#d5dbe6}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f6;--panel:#fff;--tx:#18202e;--mut:#5c677a;--ac:#2f62e0;--line:#d5dbe6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px}h1{font-size:17px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}label{color:var(--mut);display:flex;gap:6px;align-items:center}
canvas{display:block;width:100%;max-width:1068px;border-radius:10px;image-rendering:pixelated}
.m{font:12px ui-monospace,monospace;color:var(--mut);margin-top:8px}kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace}
</style></head><body><div class="wrap">
<h1>Походки врагов и боссов на арене 2,5D</h1>
<p class="sub">Детали от Codex, скелет и походки — <code>walker.js</code>. Выбранным персонажем можно управлять: <kbd>A/D</kbd> — влево/вправо, <kbd>W/S</kbd> — вглубь/ближе, <kbd>Shift</kbd> — быстрее. Остальные бродят сами. У боссов каждый шаг трясёт землю: пыль, трещины, ударная волна.</p>
<div class="row" id="sel"></div>
<div class="row"><label><input id="snd" type="checkbox"> звук шагов</label><label><input id="jt" type="checkbox"> суставы</label><button id="ps">Пауза</button></div>
<canvas id="c" width="1068" height="640"></canvas><div class="m" id="m"></div></div>
<script>
/*__WALKER__*/
const CH=__CH__,ENV=__ENV__,FX=__FX__;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,TAU=Math.PI*2,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lp=(a,b,k)=>a+(b-a)*k;
const IMG={};let left=0;const ld=src=>{left++;const i=new Image();i.onload=()=>{if(--left==0)go()};i.src=src;return i};
for(const n in CH){IMG[n]={};for(const p in CH[n])if(p!='_k')IMG[n][p]=ld(CH[n][p].src)}for(const k in ENV)IMG[k]=ld(ENV[k]);for(const k in FX)IMG[k]=ld(FX[k]);
const FLOOR0=400,zy=z=>lp(FLOOR0+24,H-18,z),WS=.36,zs=z=>lp(.84,1,z)*WS;
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]),dst=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
// крепление одежды и оружия: смещения в координатах торса (доли размеров торса), хват оружия и поза руки
const DRESS={
 ghoul:{name:'Гуль',gait:'ghoul',cloth:[[.52,.80,'cloth']]},
 knight:{name:'Падший рыцарь',gait:'knight',clothB:[.30,.78],clothF:[.70,.80],weapon:{off:-.95}},
 doctor:{name:'Чумной доктор',gait:'doctor',cloth:[[.48,.74,'cloth']],flask:1},
 goatman:{name:'Козлорог',gait:'goatman',cloth:[[.55,.80,'cloth']],digi:1},
 guardian:{name:'Каменный страж (босс)',gait:'guardian',boss:1},
 executioner:{name:'Каменный палач (босс)',gait:'executioner',boss:1,axe:1},
};
const ORDER=['ghoul','knight','doctor','goatman','guardian','executioner'];
let chars=[];
function makeChars(){chars=ORDER.map((id,i)=>{const P=CH[id],d=DRESS[id],l=P.legN,a=P.armN,t=P.torso;
  const def={id,...d,scale:(d.boss?1.7:1)*.5/CH[id]._k,L1:dst(l.root,l.joint),L2:dst(l.joint,l.end),foot:l.sole-l.end[1],T:dst(t.hip,t.sh),U:dst(a.root,a.joint),Fa:dst(a.joint,a.end),gaitOverride:id=='executioner'?{arm:.08}:{}};
  const c=Walker.create({...def,x:300+i*520,z:[.1,.5,.3,.65,.85,.95][i]});c.ai={t:Math.random()*2,dir:0,dz:0};c.home=c.x;c.cloth=0;c.clothv=0;return c})}
// ---------- рисование детали с поворотом вокруг точки ----------
function piece(img,piv,at,rot,clip){ctx.save();ctx.translate(at[0],at[1]);ctx.rotate(rot);ctx.translate(-piv[0],-piv[1]);if(clip){ctx.beginPath();if(clip.c)ctx.arc(clip.c[0],clip.c[1],clip.r,0,TAU);else ctx.rect(-20,clip.y0,img.width+40,clip.y1-clip.y0);ctx.clip()}ctx.drawImage(img,0,0);ctx.restore()}
// нога: бедро / голень / стопа (стопа в опоре стоит ровно), круглые шапки колена и лодыжки
function leg(c,part,hipW,L,dark){const P=CH[c.def.id][part],I=IMG[c.def.id][part],kn=[hipW[0]+L.kx,hipW[1]+L.ky],an=[hipW[0]+L.ax,hipW[1]+L.ay];
 const a1=ang(hipW,kn)-ang(P.root,P.joint),a2=ang(kn,an)-ang(P.joint,P.end),ov=P.r*.55,ovA=12;
 const a3=L.st?0:-.25*Math.sin(Math.PI*cl(L.lift/(c.g.lift*(c.def.L1+c.def.L2)+1e-6),0,1));
 ctx.save();if(dark)ctx.filter='brightness(.72)';
 piece(I,P.end,an,a3,{y0:P.end[1]-ovA,y1:I.height+10});piece(I,P.joint,kn,a2,{y0:P.joint[1]-ov,y1:P.end[1]+ovA});piece(I,P.end,an,a2,{c:P.end,r:ovA+6});
 piece(I,P.root,hipW,a1,{y0:-10,y1:P.joint[1]+ov});piece(I,P.joint,kn,a1,{c:P.joint,r:P.r*.92});ctx.restore();return{kn,an}}
function arm(c,part,shW,ru,rf,dark,hold){const P=CH[c.def.id][part],I=IMG[c.def.id][part],U=dst(P.root,P.joint),Fa=dst(P.joint,P.end);
 const el=[shW[0]-Math.sin(ru)*U,shW[1]+Math.cos(ru)*U],wr=[el[0]-Math.sin(rf)*Fa,el[1]+Math.cos(rf)*Fa],a1=ang(shW,el)-ang(P.root,P.joint),a2=ang(el,wr)-ang(P.joint,P.end),ov=P.r*.55;
 const hand=[el[0]+Math.cos(a2)*(P.hand[0]-P.joint[0])-Math.sin(a2)*(P.hand[1]-P.joint[1]),el[1]+Math.sin(a2)*(P.hand[0]-P.joint[0])+Math.cos(a2)*(P.hand[1]-P.joint[1])];
 if(hold)hold(hand,ang(el,wr));
 ctx.save();if(dark)ctx.filter='brightness(.72)';piece(I,P.joint,el,a2,{y0:P.joint[1]-ov,y1:I.height+10});piece(I,P.root,shW,a1,{y0:-10,y1:P.joint[1]+ov});piece(I,P.joint,el,a1,{c:P.joint,r:P.r*.9});ctx.restore()}
function drawChar(c){const id=c.def.id,P=CH[id],I=IMG[id],d=c.def,po=c.pose,t=P.torso,lean=po.lean;
 const R=(p,o=[0,0])=>{const x=p[0]-t.hip[0]+o[0],y=p[1]-t.hip[1]+o[1],cs=Math.cos(lean),sn=Math.sin(lean);return[x*cs-y*sn,x*sn+y*cs]};
 const shN=R(t.sh,[8,0]),shF=R(t.sh,[-10,-4]),hipN=[6,0],hipF=[-8,-3],tw=I.torso.width,th=I.torso.height;
 const cloth=(spec)=>{for(const [fx,fy,name] of spec){const pp=P[name],at=R([fx*tw,fy*th]);piece(I[name],pp.top,at,lean*.4+c.cloth)}};
 // дальняя рука, дальняя нога, задняя пола
 arm(c,'armF',shF,po.arms[1].ru,po.arms[1].rf,true);leg(c,'legF',hipF,po.legs[1],true);
 if(d.clothB)piece(I.clothB,P.clothB.top,R([d.clothB[0]*tw,d.clothB[1]*th]),lean*.4+c.cloth*1.2);
 leg(c,'legN',hipN,po.legs[0],false);
 piece(I.torso,t.hip,[0,0],lean);if(d.cloth)cloth(d.cloth);if(d.clothF)piece(I.clothF,P.clothF.top,R([d.clothF[0]*tw,d.clothF[1]*th]),lean*.4+c.cloth*.8);
 piece(I.head,P.head.neck,R(t.neck),lean*.5+.03*Math.sin(c.t*1.3));
 // ближняя рука с оружием
 let ru=po.arms[0].ru,rf=po.arms[0].rf,hold=null;
 if(d.weapon)hold=(h,fa)=>piece(I.weapon,P.weapon.grip,h,fa-Math.PI/2+d.weapon.off+Math.PI);
 if(d.axe){ru=-.35+lean;rf=-2.5+lean;hold=(h,fa)=>piece(I.weapon,P.weapon.grip,h,-.95+lean)}
 if(d.flask)hold=(h)=>piece(I.flask,P.flask.grip,h,0);
 if(hold&&(d.axe))arm(c,'armN',shN,ru,rf,false,hold);else{if(hold){let H0=null;arm(c,'armN',shN,ru,rf,false,(h,fa)=>{H0=[h,fa]});ctx.save();hold(H0[0],H0[1]);ctx.restore();arm(c,'armN',shN,ru,rf,false)}else arm(c,'armN',shN,ru,rf,false)}
}
// ---------- мир и эффекты ----------
let selI=4,camX=0,shake=0,dust=[],cracks=[],rings=[],paused=false;const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
document.getElementById('ps').onclick=e=>{paused=!paused;e.target.textContent=paused?'Дальше':'Пауза'};
let AC=null;function thump(p,boss){if(!document.getElementById('snd').checked)return;AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(boss?70:150,t);o.frequency.exponentialRampToValueAtTime(boss?32:70,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(cl(.15+p*.5,.05,.7),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(boss?.5:.18));o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.6)}
function step(dt){for(const [i,c] of chars.entries()){let inp=null;
  if(i==selI){const k={dir:(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dz:(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),run:keys.ShiftLeft||keys.ShiftRight};if(k.dir||k.dz)c.manual=1;if(c.manual)inp=k}
  if(!inp){const a=c.ai;a.t-=dt;if(a.t<0){if(a.dir){a.dir=0;a.dz=0;a.t=.8+Math.random()*1.4}else{a.dir=c.x>c.home+300?-1:c.x<c.home-300?1:(Math.random()<.5?-1:1);a.dz=(Math.random()-.5)*.8;a.t=2.5+Math.random()*2.5}}inp={dir:a.dir,dz:a.dz,run:false}}
  Walker.update(c,dt,inp);if(c.def.boss)c.z=Math.max(c.z,.72);c.clothv+=((-c.v*.0012-c.cloth)*60-c.clothv*8)*dt;c.cloth+=c.clothv*dt;
  for(const e of c.events){const g=c.g;if(g.shake>0)shake=Math.max(shake,g.shake*(c.def.boss?14:5));
   const n=Math.round(2+g.dust*10),ex=e.x*c.def.scale;for(let k=0;k<n;k++)dust.push({x:ex+(Math.random()-.5)*60*g.dust,z:e.z,y:0,vx:(Math.random()-.5)*(80+260*g.dust),vy:-(10+Math.random()*60*g.dust),s:(.25+.6*g.dust)*(.7+Math.random()*.6),t:0,life:.45+.5*g.dust,f:Math.random()<.5});
   if(g.cracks){cracks.push({x:ex,z:e.z,t:0,k:(Math.random()*3)|0,s:c.def.boss?1:.5});rings.push({x:ex,z:e.z,t:0})}
   if(e.power>.1)thump(e.power,c.def.boss)}}
 const c=chars[selI];camX=lp(camX,c.x*c.def.scale,1-Math.exp(-dt*3));shake*=Math.exp(-dt*7);
 dust=dust.filter(d=>(d.t+=dt)<d.life);for(const d of dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=40*dt;d.vx*=.96}
 cracks=cracks.filter(k=>(k.t+=dt)<6);rings=rings.filter(r=>(r.t+=dt)<.6)}
const wx=x=>W/2+(x-camX)*WS;const BGK=.72;
function layer(img,par,y){const w=img.width,o=((-camX*WS*par/BGK*.72)%w+w)%w;for(let x=o-w;x<W;x+=w)ctx.drawImage(img,Math.round(x),y)}
function render(){const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0e18';ctx.fillRect(0,0,W,H);ctx.translate(sx,sy*1.2);
 layer(IMG.bg_far,.2,-60);layer(IMG.bg_mid,.55,FLOOR0-350);layer(IMG.floor,1,FLOOR0);
 for(const k of cracks){const x=wx(k.x),y=zy(k.z),a=k.t<5?1:1-(k.t-5),cw=IMG.cracks.width/3,ch=IMG.cracks.height;ctx.globalAlpha=a;ctx.drawImage(IMG.cracks,k.k*cw,0,cw,ch,x-cw*.5*k.s,y-ch*.5*k.s,cw*k.s,ch*k.s);ctx.globalAlpha=1}
 for(const r of rings){const x=wx(r.x),y=zy(r.z),k=r.t/.6;ctx.strokeStyle=`rgba(200,215,240,${.35*(1-k)})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,30+180*k,(30+180*k)*.26,0,0,TAU);ctx.stroke()}
 const showJ=document.getElementById('jt').checked;
 for(const c of [...chars].sort((a,b)=>a.z-b.z)){const s=zs(c.z)*c.def.scale,x=wx(c.x*c.def.scale),y=zy(c.z);if(x<-500||x>W+500)continue;if(window.__solo&&c!==chars[selI])continue;
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(x,y,(c.def.boss?150:60)*s*2/CH[c.def.id]._k*.5,(c.def.boss?22:10)*s*2/CH[c.def.id]._k*.5,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(x,y-(c.pose.hip+c.def.foot)*s);ctx.scale(c.face*s,s);drawChar(c);
  if(showJ){ctx.fillStyle='#ffd84a';for(const l of c.pose.legs)for(const p of [[0,0],[l.kx,l.ky],[l.ax,l.ay]]){ctx.beginPath();ctx.arc(p[0],p[1],5/s,0,TAU);ctx.fill()}}ctx.restore()}
 const fw=IMG.dust.width/6;for(const d of dust){const x=wx(d.x),y=zy(d.z)+d.y,k=d.t/d.life,f=Math.min(5,(k*6)|0),sz=IMG.dust.height*d.s*(1+k);ctx.globalAlpha=.85*(1-k*.6);ctx.drawImage(IMG.dust,f*fw,0,fw,IMG.dust.height,x-sz/2,y-sz*.8,sz,sz);ctx.globalAlpha=1}
 layer(IMG.fg,1.25,H-IMG.fg.height+40);
 const c=chars[selI];document.getElementById('m').textContent=`${c.def.name}: скорость ${(Math.abs(c.v)/(c.def.L1+c.def.L2)).toFixed(2)} L/с · глубина ${c.z.toFixed(2)}${c.manual?' · управление':' · бродит сам'}`}
let last=null;function loop(ts){const dt=last==null?1/60:Math.min(.05,(ts-last)/1000);last=ts;if(!paused)step(dt);render();requestAnimationFrame(loop)}
function go(){makeChars();camX=chars[selI].x*chars[selI].def.scale;const sel=document.getElementById('sel');ORDER.forEach((id,i)=>{const b=document.createElement('button');b.textContent=DRESS[id].name;b.onclick=()=>{selI=i;[...sel.children].forEach((x,j)=>x.classList.toggle('on',j==i))};if(i==selI)b.classList.add('on');sel.appendChild(b)});
 for(let i=0;i<10;i++)step(1/60);requestAnimationFrame(loop);window.__dbg={chars,step,render,setSel:i=>{selI=i;camX=chars[i].x*chars[i].def.scale}}}
</script></body></html>
